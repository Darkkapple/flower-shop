<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><%= pageTitle %> - Flower Shop</title>
    <meta name="description" content="<%= pageDescription %>">

    <!-- CSS -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">

    <!-- Favicon -->
    <link rel="icon" href="public/images/favicon.icon" type="image/x-ico">

    <!-- Preload critical resources -->
    <link rel="preload" href="/js/main.js" as="script">

    <!-- Open Graph -->
    <meta property="og:title" content="<%= pageTitle %> - Flower Shop">
    <meta property="og:description" content="<%= pageDescription %>">
    <meta property="og:type" content="website">
    <meta property="og:url" content="<%= canonicalUrl %>">
    <meta property="og:image" content="/images/og-image.jpg">
        <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Font Awesome (альтернатива) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS (опционально) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Skip to main content for accessibility -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- Header -->
    <header>
        <nav class="navbar container">
            <!-- Logo -->
            <a href="/" class="logo">
                <span class="logo-icon">🌸</span>
                Flower Shop
            </a>

            <!-- Desktop Navigation -->
            <ul class="nav-links">
                <li><a href="/" class="<%= currentPage === 'home' ? 'active' : '' %>">Home</a></li>
                <li><a href="/catalog" class="<%= currentPage === 'catalog' ? 'active' : '' %>">Catalog</a></li>
                <li><a href="/about" class="<%= currentPage === 'about' ? 'active' : '' %>">About</a></li>
                <li><a href="/contact" class="<%= currentPage === 'contact' ? 'active' : '' %>">Contact</a></li>
            </ul>

            <!-- Mobile Menu Button -->
            <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Open menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <!-- User Actions -->
            <div class="nav-actions">
                <!-- Search Button -->
                <button class="search-btn" id="search-btn" aria-label="Search">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.3-4.3"></path>
                    </svg>
                </button>

                <!-- Cart -->
                <a href="/cart" class="cart-link" aria-label="Shopping cart">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span id="cart-count" class="cart-count">0</span>
                </a>

                <!-- User Info -->
                <div id="user-info" class="user-info" style="display: none;">
                    <div class="user-dropdown">
                        <button class="user-toggle" id="user-toggle">
                            <span id="username"></span>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="m6 9 6 6 6-6"></path>
                            </svg>
                        </button>
                        <div class="dropdown-menu">
                            <a href="/profile" class="dropdown-item">My Profile</a>
                            <a href="/orders" class="dropdown-item">My Orders</a>
                            <a href="/admin" id="admin-panel-link" style="display: none;" class="dropdown-item">Admin Panel</a>
                            <div class="dropdown-divider"></div>
                            <button id="logout-btn" class="dropdown-item logout-btn">Logout</button>
                        </div>
                    </div>
                </div>

                <!-- Login Button -->
                <a href="/login" id="login-btn" class="btn btn-primary">Login</a>
            </div>
        </nav>
    </header>

    <!-- Mobile Menu -->
    <div class="mobile-menu" id="mobile-menu">
        <div class="mobile-menu-header">
            <span class="mobile-menu-title">Menu</span>
            <button class="mobile-menu-close" id="mobile-menu-close" aria-label="Close menu">
                &times;
            </button>
        </div>
        <ul class="mobile-nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/catalog">Catalog</a></li>
            <li><a href="/about">About</a></li>
            <li><a href="/contact">Contact</a></li>
            <li><a href="/cart">Cart (<span class="cart-count-mobile">0</span>)</a></li>
            <li><a href="/login" id="mobile-login-btn">Login</a></li>
            <li style="display: none;" id="mobile-user-info">
                <a href="/profile">My Account</a>
                <a href="/orders">My Orders</a>
                <button class="logout-btn-mobile">Logout</button>
            </li>
        </ul>
    </div>

    <!-- Search Overlay -->
    <div class="search-overlay" id="search-overlay">
        <div class="search-header">
            <h2>Search Products</h2>
            <button class="search-close" id="search-close" aria-label="Close search">
                &times;
            </button>
        </div>
        <div class="search-container">
            <input type="text"
                   class="global-search-input"
                   id="global-search-input"
                   placeholder="Search for flowers, bouquets..."
                   autocomplete="off">
            <div class="search-results" id="search-results"></div>
        </div>
    </div>

    <!-- Main Content -->
    <main id="main-content">
