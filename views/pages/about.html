<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowershop - Красивые цветы для любого случая</title>
    <meta name="description" content="Откройте нашу изысканную коллекцию растений, идеальных для любой обстановки. Доставка в течении недели.">

    <!-- CSS -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">

    <!-- Favicon -->
    <link rel="icon" href="public/images/favicon.ico" type="image/x-icon">
</head>
<body>
    <!-- Header -->
    <header>
        <nav class="navbar container">
            <a href="/" class="logo">
                <span class="logo-icon">🌸</span>
                Flowershop
            </a>

            <!-- Desktop Navigation -->
            <ul class="nav-links">
                <li><a href="/" class="active">Главная</a></li>
                <li><a href="/catalog">Каталог</a></li>
                <li><a href="/about">О нас</a></li>
                <li><a href="/contact">Контакты</a></li>
            </ul>

            <!-- User Actions -->
            <div class="nav-actions">
                <a href="/cart" class="cart-link">
                    <span>Корзина</span>
                    <span id="cart-count" class="cart-count">0</span>
                </a>

                <!-- User Info -->
                <div id="user-info" class="user-info" style="display: none;">
                    <span>Привет, <span id="username"></span></span>
                    <button id="logout-btn" class="btn btn-outline btn-sm">Выйти</button>
                    <a href="/admin" id="admin-panel-link" style="display: none;" class="btn btn-outline btn-sm">Админ</a>
                </div>

                <!-- Login Button -->
                <a href="/login" id="login-btn" class="btn btn-primary">Войти</a>
            </div>
        </nav>
    </header>
    <section class="section-padding">
        <div class="container">
            <h1>О нас</h1>
            <p>Страница в разработке</p>
        </div>
    </section>
                    <!-- Contact Info -->
                <div class="footer-section">
                    <h3 class="footer-title">Контакты</h3>
                    <div class="contact-info">
                        <div class="contact-item">
                            <span>📧</span>
                            <span>info@flowershop.ru</span>
                        </div>
                        <div class="contact-item">
                            <span>📞</span>
                            <span>+7 (913) 155 70-00</span>
                        </div>
                        <div class="contact-item">
                            <span>📍</span>
                            <span>Москва, ул. Цветочная, д. 123</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer Bottom -->
            <div class="footer-bottom">
                <div class="footer-bottom-content">
                    <p>&copy; 2025 Flowershop. Все права защищены.</p>
                    <div class="footer-bottom-links">
                        <a href="/privacy">Политика конфиденциальности</a>
                        <a href="/terms">Условия использования</a>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="/js/auth.js"></script>
    <script src="/js/cart.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
