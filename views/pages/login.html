<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Flower Shop</title>
    <meta name="description" content="Login to your Flower Shop account to manage orders and save favorites.">
    
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <!-- Simple Header for Auth Pages -->
    <header style="background: white; box-shadow: var(--shadow);">
        <nav class="navbar container">
            <a href="/" class="logo">
                <span class="logo-icon">🌸</span>
                Flower Shop
            </a>
            <a href="/" class="btn btn-outline">Back to Home</a>
        </nav>
    </header>

    <!-- Auth Container -->
    <div class="auth-container">
        <div class="auth-card">
            <!-- Auth Header -->
            <div class="auth-header">
                <div class="auth-logo">
                    <span class="logo-icon">🌸</span>
                    Flower Shop
                </div>
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Sign in to your account to continue</p>
            </div>

            <!-- Login Form -->
            <form class="auth-form" id="login-form" data-validate>
                <div class="form-group">
                    <label for="username">Username or Email</label>
                    <input type="text" 
                           id="username" 
                           name="username" 
                           required 
                           autocomplete="username"
                           placeholder="Enter your username or email">
                    <span class="error-message" id="username-error"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" 
                           id="password" 
                           name="password" 
                           required 
                           autocomplete="current-password"
                           placeholder="Enter your password">
                    <span class="error-message" id="password-error"></span>
                </div>

                <div class="form-options">
                    <div class="checkbox-group">
                        <input type="checkbox" id="remember-me" name="remember-me">
                        <label for="remember-me" class="checkbox-label">Remember me</label>
                    </div>
                    <a href="/forgot-password" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="auth-btn" id="login-submit-btn">
                    <span class="btn-text">Sign In</span>
                    <div class="btn-spinner"></div>
                </button>
            </form>

            <!-- Demo Accounts Notice -->
            <div style="background: #e8f4fd; padding: 1rem; border-radius: 8px; margin: 1.5rem 0; text-align: center;">
                <p style="margin: 0; color: #1976d2; font-size: 0.9rem;">
                    <strong>Demo:</strong> Use any username/password to test the login
                </p>
            </div>

            <!-- Social Login -->
            <div class="social-login">
                <div class="divider">
                    <span>Or continue with</span>
                </div>
                <div class="social-buttons">
                    <button type="button" class="social-btn google-btn" disabled>
                        <span>G</span>
                        Google
                    </button>
                    <button type="button" class="social-btn facebook-btn" disabled>
                        <span>f</span>
                        Facebook
                    </button>
                </div>
            </div>

            <!-- Auth Footer -->
            <div class="auth-footer">
                <p>Don't have an account? <a href="/register" class="auth-link">Sign up</a></p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 Flower Shop. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="/js/auth.js"></script>
    <script src="/js/main.js"></script>
    
    <script>
        // Redirect if already logged in
        document.addEventListener('DOMContentLoaded', () => {
            if (window.authManager && window.authManager.isAuthenticated()) {
                window.location.href = '/';
            }
        });
    </script>
</body>
</html>
