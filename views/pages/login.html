<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Flowershop</title>
    <meta name="description" content="Войдите в свой аккаунт Flowershop для управления заказами и сохранения избранного.">

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <!-- Simple Header for Auth Pages -->
    <header style="background: white; box-shadow: var(--shadow);">
        <nav class="navbar container">
            <a href="/" class="logo">
                <span class="logo-icon">🌸</span>
                Flowershop
            </a>
            <a href="/" class="btn btn-outline">На главную</a>
        </nav>
    </header>

    <!-- Auth Container -->
    <div class="auth-container">
        <div class="auth-card">
            <!-- Auth Header -->
            <div class="auth-header">
                <div class="auth-logo">
                    <span class="logo-icon">🌸</span>
                    Flowershop
                </div>
                <h1 class="auth-title">С возвращением</h1>
                <p class="auth-subtitle">Войдите в свой аккаунт, чтобы продолжить</p>
            </div>

            <!-- Login Form -->
            <form class="auth-form" id="login-form" data-validate>
                <div class="form-group">
                    <label for="username">Имя пользователя или Email</label>
                    <input type="text"
                           id="username"
                           name="username"
                           required
                           autocomplete="username"
                           placeholder="Введите имя пользователя или email">
                    <span class="error-message" id="username-error"></span>
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password"
                           id="password"
                           name="password"
                           required
                           autocomplete="current-password"
                           placeholder="Введите ваш пароль">
                    <span class="error-message" id="password-error"></span>
                </div>

                <div class="form-options">
                    <div class="checkbox-group">
                        <input type="checkbox" id="remember-me" name="remember-me">
                        <label for="remember-me" class="checkbox-label">Запомнить меня</label>
                    </div>
                    <a href="/forgot-password" class="forgot-password">Забыли пароль?</a>
                </div>

                <button type="submit" class="auth-btn" id="login-submit-btn">
                    <span class="btn-text">Войти</span>
                    <div class="btn-spinner"></div>
                </button>
            </form>

            <!-- Demo Accounts Notice -->
            <div style="background: #e8f4fd; padding: 1rem; border-radius: 8px; margin: 1.5rem 0; text-align: center;">
                <p style="margin: 0; color: #1976d2; font-size: 0.9rem;">
                    <strong>Демо:</strong> Используйте любое имя пользователя/пароль для тестирования
                </p>
            </div>

            <!-- Social Login -->
            <div class="social-login">
                <div class="divider">
                    <span>Или войдите через</span>
                </div>
                <div class="social-buttons">
                    <button type="button" class="social-btn google-btn" disabled>
                        <span>G</span>
                        Google
                    </button>
                    <button type="button" class="social-btn facebook-btn" disabled>
                        <span>f</span>
                        Facebook
                    </button>
                </div>
            </div>

            <!-- Auth Footer -->
            <div class="auth-footer">
                <p>Нет аккаунта? <a href="/register" class="auth-link">Зарегистрироваться</a></p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2025 Flowershop. Все права защищены.</p>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="/js/auth.js"></script>
    <script src="/js/main.js"></script>

    <script>
        // Redirect if already logged in
        document.addEventListener('DOMContentLoaded', () => {
            if (window.authManager && window.authManager.isAuthenticated()) {
                window.location.href = '/';
            }
        });
    </script>
</body>
</html>
