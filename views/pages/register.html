<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Flower Shop</title>
    <meta name="description" content="Create a new Flower Shop account to save favorites and track orders.">
    
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <!-- Simple Header for Auth Pages -->
    <header style="background: white; box-shadow: var(--shadow);">
        <nav class="navbar container">
            <a href="/" class="logo">
                <span class="logo-icon">🌸</span>
                Flower Shop
            </a>
            <a href="/" class="btn btn-outline">Back to Home</a>
        </nav>
    </header>

    <!-- Auth Container -->
    <div class="auth-container">
        <div class="auth-card">
            <!-- Auth Header -->
            <div class="auth-header">
                <div class="auth-logo">
                    <span class="logo-icon">🌸</span>
                    Flower Shop
                </div>
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Join us to start your floral journey</p>
            </div>

            <!-- Registration Form -->
            <form class="auth-form" id="register-form" data-validate>
                <div class="form-group">
                    <label for="reg-username">Username</label>
                    <input type="text" 
                           id="reg-username" 
                           name="username" 
                           required 
                           autocomplete="username"
                           placeholder="Choose a username"
                           minlength="3"
                           maxlength="50">
                    <span class="error-message" id="username-error"></span>
                </div>

                <div class="form-group">
                    <label for="reg-email">Email Address</label>
                    <input type="email" 
                           id="reg-email" 
                           name="email" 
                           required 
                           autocomplete="email"
                           placeholder="Enter your email address">
                    <span class="error-message" id="email-error"></span>
                </div>

                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <input type="password" 
                           id="reg-password" 
                           name="password" 
                           required 
                           autocomplete="new-password"
                           placeholder="Create a password"
                           minlength="6">
                    <div class="password-strength">
                        <div class="strength-bar">
                            <div class="strength-fill" id="password-strength"></div>
                        </div>
                        <div class="strength-text" id="password-strength-text"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-confirm-password">Confirm Password</label>
                    <input type="password" 
                           id="reg-confirm-password" 
                           name="confirmPassword" 
                           required 
                           autocomplete="new-password"
                           placeholder="Confirm your password">
                    <span class="error-message" id="confirm-password-error"></span>
                </div>

                <div class="form-options">
                    <div class="checkbox-group">
                        <input type="checkbox" id="agree-terms" name="agree-terms" required>
                        <label for="agree-terms" class="checkbox-label">
                            I agree to the <a href="/terms" target="_blank" style="color: var(--primary-color);">Terms of Service</a> 
                            and <a href="/privacy" target="_blank" style="color: var(--primary-color);">Privacy Policy</a>
                        </label>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        <label for="newsletter" class="checkbox-label">
                            Send me special offers and flower care tips
                        </label>
                    </div>
                </div>

                <button type="submit" class="auth-btn" id="register-submit-btn">
                    <span class="btn-text">Create Account</span>
                    <div class="btn-spinner"></div>
                </button>
            </form>

            <!-- Social Registration -->
            <div class="social-login">
                <div class="divider">
                    <span>Or sign up with</span>
                </div>
                <div class="social-buttons">
                    <button type="button" class="social-btn google-btn" disabled>
                        <span>G</span>
                        Google
                    </button>
                    <button type="button" class="social-btn facebook-btn" disabled>
                        <span>f</span>
                        Facebook
                    </button>
                </div>
            </div>

            <!-- Auth Footer -->
            <div class="auth-footer">
                <p>Already have an account? <a href="/login" class="auth-link">Sign in</a></p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 Flower Shop. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="/js/auth.js"></script>
    <script src="/js/main.js"></script>
    
    <script>
        // Redirect if already logged in
        document.addEventListener('DOMContentLoaded', () => {
            if (window.authManager && window.authManager.isAuthenticated()) {
                window.location.href = '/';
            }
        });
    </script>
</body>
</html>
