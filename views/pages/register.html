<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Flowershop</title>
    <meta name="description" content="Создайте новый аккаунт в Цветочном Магазине для сохранения избранного и отслеживания заказов.">

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <!-- Simple Header for Auth Pages -->
    <header style="background: white; box-shadow: var(--shadow);">
        <nav class="navbar container">
            <a href="/" class="logo">
                <span class="logo-icon">🌸</span>
                Flowershop
            </a>
            <a href="/" class="btn btn-outline">На главную</a>
        </nav>
    </header>

    <!-- Auth Container -->
    <div class="auth-container">
        <div class="auth-card">
            <!-- Auth Header -->
            <div class="auth-header">
                <div class="auth-logo">
                    <span class="logo-icon">🌸</span>
                    Flowershop
                </div>
                <h1 class="auth-title">Создать аккаунт</h1>
                <p class="auth-subtitle">Присоединяйтесь к нам, чтобы начать цветочное путешествие</p>
            </div>

            <!-- Registration Form -->
            <form class="auth-form" id="register-form" data-validate>
                <div class="form-group">
                    <label for="reg-username">Имя пользователя</label>
                    <input type="text"
                           id="reg-username"
                           name="username"
                           required
                           autocomplete="username"
                           placeholder="Выберите имя пользователя"
                           minlength="3"
                           maxlength="50">
                    <span class="error-message" id="username-error"></span>
                </div>

                <div class="form-group">
                    <label for="reg-email">Email адрес</label>
                    <input type="email"
                           id="reg-email"
                           name="email"
                           required
                           autocomplete="email"
                           placeholder="Введите ваш email адрес">
                    <span class="error-message" id="email-error"></span>
                </div>

                <div class="form-group">
                    <label for="reg-password">Пароль</label>
                    <input type="password"
                           id="reg-password"
                           name="password"
                           required
                           autocomplete="new-password"
                           placeholder="Создайте пароль"
                           minlength="6">
                    <div class="password-strength">
                        <div class="strength-bar">
                            <div class="strength-fill" id="password-strength"></div>
                        </div>
                        <div class="strength-text" id="password-strength-text"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-confirm-password">Подтвердите пароль</label>
                    <input type="password"
                           id="reg-confirm-password"
                           name="confirmPassword"
                           required
                           autocomplete="new-password"
                           placeholder="Подтвердите ваш пароль">
                    <span class="error-message" id="confirm-password-error"></span>
                </div>

                <div class="form-options">
                    <div class="checkbox-group">
                        <input type="checkbox" id="agree-terms" name="agree-terms" required>
                        <label for="agree-terms" class="checkbox-label">
                            Я согласен с <a href="/terms" target="_blank" style="color: var(--primary-color);">Условиями использования</a>
                            и <a href="/privacy" target="_blank" style="color: var(--primary-color);">Политикой конфиденциальности</a>
                        </label>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        <label for="newsletter" class="checkbox-label">
                            Присылать мне специальные предложения и советы по уходу за цветами
                        </label>
                    </div>
                </div>

                <button type="submit" class="auth-btn" id="register-submit-btn">
                    <span class="btn-text">Создать аккаунт</span>
                    <div class="btn-spinner"></div>
                </button>
            </form>

            <!-- Social Registration -->
            <div class="social-login">
                <div class="divider">
                    <span>Или зарегистрируйтесь через</span>
                </div>
                <div class="social-buttons">
                    <button type="button" class="social-btn google-btn" disabled>
                        <span>G</span>
                        Google
                    </button>
                    <button type="button" class="social-btn facebook-btn" disabled>
                        <span>f</span>
                        Facebook
                    </button>
                </div>
            </div>

            <!-- Auth Footer -->
            <div class="auth-footer">
                <p>Уже есть аккаунт? <a href="/login" class="auth-link">Войти</a></p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2025 Flowershop. Все права защищены.</p>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="/js/auth.js"></script>
    <script src="/js/main.js"></script>

    <script>
        // Redirect if already logged in
        document.addEventListener('DOMContentLoaded', () => {
            if (window.authManager && window.authManager.isAuthenticated()) {
                window.location.href = '/';
            }
        });
    </script>
</body>
</html>
